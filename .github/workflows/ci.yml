name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Use Node.js 22.13.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # ESLint + i18n catalog parity, then relative Markdown links (docs/archive excluded).
        run: pnpm lint && pnpm lint:docs

      - name: Verify generated API types are current
        # schema.d.ts is generated from openapi.yaml. Regenerating must be a
        # no-op; a diff means someone edited the types by hand or updated the
        # spec without running `pnpm api:generate`.
        run: pnpm api:check

      - name: Type check
        # src/lib/api/generated/conformance.ts asserts the hand-written client
        # types still match the generated ones, so contract drift fails here.
        run: pnpm typecheck

      - name: Test (with coverage)
        # Fails when coverage drops below vitest.config.ts `coverage.thresholds` (ratchet, see README).
        run: pnpm test:ci --coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: pnpm build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NEXT_PUBLIC_API_URL: 'mock'
      NEXT_PUBLIC_API_MOCKING: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Use Node.js 22.13.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      # build:mock / start:mock set these too; kept here so every step agrees.
      NEXT_PUBLIC_API_URL: 'mock'
      NEXT_PUBLIC_API_MOCKING: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Use Node.js 22.13.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (mock API)
        run: pnpm build:mock

      - name: Lighthouse CI
        # lighthouserc.json starts the server with `pnpm start:mock` and holds
        # the URLs and assertions (a11y/SEO hard, perf/best-practices warn).
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          # Reports stay private as run artifacts; no public storage upload.
          temporaryPublicStorage: false
