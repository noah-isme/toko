name: Production configuration validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-config:
    name: Validate production-shaped build
    runs-on: ubuntu-latest
    env:
      # These non-routable domains exercise the production contract without
      # exposing or requiring real tenant, API, payment, or telemetry secrets.
      NODE_ENV: production
      VERCEL_ENV: production
      NEXT_PUBLIC_API_URL: https://api.toko.invalid/api/v1
      NEXT_PUBLIC_API_MOCKING: 'false'
      NEXT_PUBLIC_TENANT_ID: ci-deployment-validation
      NEXT_PUBLIC_SITE_URL: https://shop.toko.invalid
      NEXT_PUBLIC_CDN_URL: https://cdn.toko.invalid
      NEXT_PUBLIC_APP_NAME: toko
      NEXT_PUBLIC_RUM_DEST: none
      NEXT_PUBLIC_RUM_SAMPLE: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production environment contract
        run: pnpm deployment:validate -- --production

      - name: Build with production-shaped public configuration
        run: pnpm build

      # The mock API (src/mocks/**) is imported only behind literal env guards, so
      # a real-API build must not contain its fixtures or faker. "Jl. Sudirman
      # No. 12" is a fixture-only address used as the marker.
      - name: Verify mock fixtures are not bundled
        run: |
          if grep -rlF "Jl. Sudirman No. 12" .next/server .next/static; then
            echo "::error::Mock fixture data leaked into the production build"
            exit 1
          fi
          if grep -rlF "@faker-js" .next/server .next/static; then
            echo "::error::@faker-js leaked into the production build"
            exit 1
          fi
